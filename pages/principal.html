<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Catálogo de Hinos — OFIP &amp; CVS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Aladin&family=Abhaya+Libre:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/catalogo.css" />
  <link rel="manifest" href="../manifest.json" />
  <link rel="icon" href="../assets/icons/app/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="../assets/icons/app/favicon-16.png" sizes="16x16" type="image/png" />
  <link rel="apple-touch-icon" href="../assets/icons/app/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="OFIP & CVS" />
  <meta name="theme-color" content="#EF6400" />
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function (OneSignal) {
      await OneSignal.init({
        appId: "ef953217-f8ed-4ee7-869e-0cbb382a4e55",
        serviceWorkerPath: "sw.js",
      });
    });
  </script>
</head>
<body>
  <div class="fundo-textura" aria-hidden="true"></div>
  <header class="catalogo-header">
    <div class="menu-wrap">
      <button type="button" id="menu-toggle" class="menu-toggle" aria-label="Abrir menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="menu-dropdown" id="menu-dropdown" hidden>
        <button type="button" id="menu-tutorial" class="menu-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.5 9a2.5 2.5 0 0 1 4.8 1c0 1.5-2 2-2.3 3.2"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <span>Como usar</span>
        </button>
        <button type="button" id="menu-instalar" class="menu-item" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M8 8l4-4 4 4"/><path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg>
          <span>Instalar app</span>
        </button>
        <button type="button" id="menu-notificacoes" class="menu-item" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span>Ativar notificações</span>
        </button>
        <a href="admin.html" class="menu-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18h16M4 18l-1-9 5 4 4-6 4 6 5-4-1 9"/></svg>
          <span>Maestros</span>
        </a>
        <button type="button" id="menu-sair" class="menu-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span>Sair</span>
        </button>
      </div>
    </div>
    <div class="catalogo-header-top">
      <img class="catalogo-logo" src="../assets/logo/logo-combinado.png" alt="Coral Vozes de Sião / Orquestra Filarmônica Petrus" />
      <p class="catalogo-usuario" id="usuario-info"></p>
    </div>
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Alternar tema claro/escuro">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    </button>
    <div class="catalogo-pauta">
      <div class="categoria-marca-dagua" id="categoria-marca-dagua" aria-hidden="true"></div>
    </div>
  </header>

  <div class="catalogo-busca">
    <label for="busca" class="sr-only">Buscar por nome ou número da Harpa</label>
    <input type="search" id="busca" placeholder="Buscar por nome ou número da Harpa..." autocomplete="off" />
    <div class="ordenar-wrap">
      <button type="button" id="btn-ordenar" class="btn-ordenar" aria-label="Ordenar hinos" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M8 12h8M11 18h2"/></svg>
      </button>
      <div class="ordenar-dropdown" id="ordenar-dropdown" hidden>
        <button type="button" class="ordenar-item" data-ordenar="alfabetica">Ordem alfabética</button>
        <button type="button" class="ordenar-item" data-ordenar="recentes">Recém-adicionados</button>
        <button type="button" class="ordenar-item" data-ordenar="antigos">Mais antigos</button>
      </div>
    </div>
  </div>

  <nav class="categoria-nav" id="categoria-nav" aria-label="Categorias de hinos"></nav>

  <main class="hino-lista" id="hino-lista">
    <p class="carregando" id="carregando">Carregando hinos...</p>
  </main>

  <script type="module" src="../js/catalogo.js"></script>
</body>
</html>
