<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Maestros — OFIP &amp; CVS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Aladin&family=Abhaya+Libre:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/catalogo.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body>
  <div class="fundo-textura" aria-hidden="true"></div>
  <header class="catalogo-header">
    <div class="catalogo-header-top">
      <a href="principal.html" class="menu-toggle" aria-label="Voltar pro catálogo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <img class="catalogo-logo" src="../assets/logo/logo-combinado.png" alt="Coral Vozes de Sião / Orquestra Filarmônica Petrus" />
      <p class="catalogo-usuario">Área restrita</p>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Alternar tema claro/escuro">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
    </div>
  </header>

  <main class="admin-conteudo">
    <section id="tela-senha" class="admin-card">
      <h1 class="admin-titulo">Esse acesso é restrito a maestros</h1>
      <label for="senha-admin" class="sr-only">Senha</label>
      <input type="password" id="senha-admin" placeholder="Senha" autocomplete="off" />
      <button type="button" id="btn-entrar" class="admin-btn">Entrar</button>
      <p class="admin-erro" id="senha-erro" hidden>Senha incorreta.</p>
    </section>

    <section id="tela-lista" class="admin-card" hidden>
      <h1 class="admin-titulo">Hinos cadastrados</h1>
      <button type="button" id="btn-novo-hino" class="admin-btn">+ Adicionar novo hino</button>
      <p class="admin-status" id="lista-status"></p>
      <div id="lista-hinos" class="lista-hinos"></div>
    </section>

    <section id="tela-formulario" class="admin-card" hidden>
      <button type="button" id="btn-voltar-lista" class="admin-link-voltar">&larr; Voltar pra lista</button>
      <h1 class="admin-titulo" id="form-titulo-secao">Adicionar novo hino</h1>
      <form id="form-hino">
        <input type="hidden" id="hino_id" name="hino_id" />
        <label class="campo-label" for="titulo">Título</label>
        <input type="text" id="titulo" name="titulo" required />

        <label class="campo-label" for="numero_harpa">Número da Harpa (opcional)</label>
        <input type="number" id="numero_harpa" name="numero_harpa" min="1" />

        <div class="campo-categoria" id="campo-categoria">
          <label class="campo-label" for="categoria">Categoria</label>
          <select id="categoria" name="categoria" required></select>
        </div>
        <p class="admin-info" id="aviso-categoria-coral" hidden>Categoria: Coral Vozes de Sião (automático, só naipe de coral anexado)</p>

        <label class="campo-label" for="audio_referencia">Áudio de referência (opcional)</label>
        <div class="campo-arquivo-audio">
          <input type="file" id="audio_referencia" name="audio_referencia" accept="audio/*" class="arquivo-input" />
          <label class="arquivo-btn" for="audio_referencia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M8 8l4-4 4 4"/><path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg><span>Escolher arquivo</span></label>
          <span class="arquivo-status" id="audio-arquivo-status"></span>
        </div>
        <p class="admin-info" id="aviso-audio-existente" hidden>Já tem áudio — selecione um novo arquivo só se quiser substituir.</p>

        <h2 class="admin-subtitulo">Orquestra</h2>
        <div class="naipes-grid" id="naipes-orquestra"></div>

        <h2 class="admin-subtitulo">Coral</h2>
        <div class="naipes-grid" id="naipes-coral"></div>

        <button type="submit" class="admin-btn">Salvar hino</button>
        <p class="admin-status" id="form-status"></p>
      </form>
    </section>
  </main>

  <script type="module" src="../js/admin.js"></script>
</body>
</html>
